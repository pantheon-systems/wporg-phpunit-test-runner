name: WordPress PHPUnit tests

on:
  schedule:
    # By default, the workflow will run every hour.
    - cron: '0 * * * *'
    # Every 3 hours.
    # - cron:  '0 0/3 * * *'
    # Every 6 hours.
    # - cron:  '0 0/6 * * *'
    # Every 12 hours.
    # - cron:  '0 0/12 * * *'
    # Once per day at 00:00.
    # - cron:  '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to test. Defaults to all supported Pantheon PHP versions.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
          - '8.1'
          - '7.4'
      db_version:
        description: 'MariaDB version to test. Defaults to all supported Pantheon MariaDB versions.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '10.4'
          - '10.6'
      test_group:
        description: 'Run only tests in this @group. Defaults to full suite.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - actions
          - canonical
          - comment
          - cron
          - db
          - feed
          - filters
          - formatting
          - http
          - image
          - l10n
          - media
          - ms-site
          - option
          - post
          - query
          - rest-api
          - rewrite
          - taxonomy
          - themes
          - upload
          - user
          - utf8
      test_filter:
        description: 'PHPUnit --filter pattern — matches against class and method names. Examples: Tests_DB, Tests_Options, Tests_Post_Types::test_register. Overrides test_group if set.'
        required: false
        default: ''

jobs:
  # Runs the WordPress PHPUnit test suite on the Pantheon environment via Terminus.
  #
  # Each matrix combination maps to a dedicated Pantheon multidev environment named
  # php{XY}-db{ZZZ} (e.g. php84-db106), pre-configured with the matching PHP and
  # MariaDB versions via pantheon.yml. This avoids any dynamic version switching at
  # runtime and gives each combination a clean, isolated database.
  #
  # Flow:
  # 1. Prepare: git clone wordpress-develop on the Pantheon container via Terminus.
  # 2. Test: run PHPUnit on Pantheon via terminus remote:wp eval --skip-wordpress.
  # 3. Report: fetch results from Pantheon, upload to WordPress.org.
  # 4. Cleanup: remove test dir on Pantheon.
  test:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Skip matrix combinations not selected via workflow_dispatch inputs.
    # On schedule/push, inputs are empty so all combinations run.
    if: |
      (inputs.php_version == '' || inputs.php_version == 'all' || inputs.php_version == matrix.php) &&
      (inputs.db_version == '' || inputs.db_version == 'all' || inputs.db_version == matrix.db)

    # One concurrent run per PHP+MariaDB combination — each multidev has its own
    # database so there's no cross-combination conflict, but we still prevent
    # duplicate runs for the same combination from piling up.
    concurrency:
      group: ${{ github.workflow }}-php${{ matrix.php }}-db${{ matrix.db }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3', '8.2', '8.1', '7.4']
        db: ['10.4', '10.6']

    env:
      WPT_PREPARE_DIR: ${{ secrets.WPT_PREPARE_DIR }}
      WPT_TEST_DIR: ${{ secrets.WPT_TEST_DIR }}
      WPT_REPORT_API_KEY: ${{ secrets.WPT_REPORT_API_KEY }}
      WPT_SSH_PRIVATE_KEY_BASE64: ${{ secrets.WPT_SSH_PRIVATE_KEY_BASE64 }}
      PANTHEON_SITE_NAME: ${{ secrets.PANTHEON_SITE_NAME }}
      TERMINUS_MACHINE_TOKEN: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
      WPT_TEST_GROUP: ${{ inputs.test_group }}
      WPT_TEST_FILTER: ${{ inputs.test_filter }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set matrix-derived environment variables
        run: |
          PHP_SHORT=$(echo "${{ matrix.php }}" | tr -d '.')
          DB_SHORT=$(echo "${{ matrix.db }}" | tr -d '.')
          echo "PANTHEON_SITE_ENV=php${PHP_SHORT}-db${DB_SHORT}" >> $GITHUB_ENV
          echo "WPT_PHP_EXECUTABLE=php${{ matrix.php }}" >> $GITHUB_ENV

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@409451ede17f75acac08f42edc823fee6c435057 # v1
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}

      - name: Install Terminus plugins
        run: |
          terminus self:plugin:install pantheon-systems/terminus-composer-plugin

      - name: Wake and configure Pantheon environment
        run: |
          terminus art wordpress
          terminus env:wake ${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }}
          terminus site:info ${{ secrets.PANTHEON_SITE_NAME }}
          terminus env:info ${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }}
          terminus connection:set ${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }} sftp

      - name: Prepare environment
        run: php prepare.php

      - name: Run unit tests
        run: php test.php
        # Prevent the workflow from stopping if there are test failures.
        continue-on-error: true

      - name: Report the results
        run: php report.php
        # Prevent the workflow from stopping if the reporting fails.
        continue-on-error: true

      - name: Cleanup
        run: php cleanup.php
