name: WordPress PHPUnit tests

on:
  schedule:
    # By default, the workflow will run every hour.
    - cron: '0 * * * *'
    # Every 3 hours.
    # - cron:  '0 0/3 * * *'
    # Every 6 hours.
    # - cron:  '0 0/6 * * *'
    # Every 12 hours.
    # - cron:  '0 0/12 * * *'
    # Once per day at 00:00.
    # - cron:  '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to test. Defaults to all supported Pantheon PHP versions.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
          - '8.1'
          - '7.4'
      db_version:
        description: 'MariaDB version to test. Defaults to all supported Pantheon MariaDB versions.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '10.4'
          - '10.6'
      test_group:
        description: 'Run only tests in this @group. Defaults to full suite.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - actions
          - canonical
          - comment
          - cron
          - db
          - feed
          - filters
          - formatting
          - http
          - image
          - l10n
          - media
          - ms-site
          - option
          - post
          - query
          - rest-api
          - rewrite
          - taxonomy
          - themes
          - upload
          - user
          - utf8
      test_filter:
        description: 'PHPUnit --filter pattern — matches against class and method names. Examples: Tests_DB, Tests_Options, Tests_Post_Types::test_register. Overrides test_group if set.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Resolve the matrix from workflow_dispatch inputs. The `matrix` context is not
  # available in a job-level `if:`, so filtering has to happen here: this job emits
  # the PHP and MariaDB lists (full set on schedule/push, or a single value when an
  # input selects one), and the test job builds its matrix from them via fromJson.
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.resolve.outputs.php }}
      db: ${{ steps.resolve.outputs.db }}
    steps:
      - name: Resolve PHP and MariaDB lists
        id: resolve
        env:
          IN_PHP: ${{ inputs.php_version }}
          IN_DB: ${{ inputs.db_version }}
        run: |
          ALL_PHP='["8.5","8.4","8.3","8.2","8.1","7.4"]'
          ALL_DB='["10.4","10.6"]'
          if [ -z "$IN_PHP" ] || [ "$IN_PHP" = "all" ]; then
            echo "php=$ALL_PHP" >> "$GITHUB_OUTPUT"
          else
            echo "php=[\"$IN_PHP\"]" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$IN_DB" ] || [ "$IN_DB" = "all" ]; then
            echo "db=$ALL_DB" >> "$GITHUB_OUTPUT"
          else
            echo "db=[\"$IN_DB\"]" >> "$GITHUB_OUTPUT"
          fi

  # Runs the WordPress PHPUnit test suite on the Pantheon environment via Terminus.
  #
  # Each matrix combination maps to a dedicated Pantheon multidev environment named
  # php{XY}-db{ZZZ} (e.g. php84-db106), pre-configured with the matching PHP and
  # MariaDB versions via pantheon.yml. This avoids any dynamic version switching at
  # runtime and gives each combination a clean, isolated database.
  #
  # Flow:
  # 1. Prepare: git clone wordpress-develop on the Pantheon container via Terminus.
  # 2. Test: run PHPUnit on Pantheon via terminus remote:wp eval --skip-wordpress.
  # 3. Report: fetch results from Pantheon, upload to WordPress.org.
  # 4. Cleanup: remove test dir on Pantheon.
  test:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.db }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # One concurrent run per PHP+MariaDB combination — each multidev has its own
    # database so there's no cross-combination conflict, but we still prevent
    # duplicate runs for the same combination from piling up.
    concurrency:
      group: ${{ github.workflow }}-php${{ matrix.php }}-db${{ matrix.db }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJson(needs.setup.outputs.php) }}
        db: ${{ fromJson(needs.setup.outputs.db) }}

    env:
      WPT_PREPARE_DIR: ${{ secrets.WPT_PREPARE_DIR }}
      WPT_TEST_DIR: ${{ secrets.WPT_TEST_DIR }}
      WPT_REPORT_API_KEY: ${{ secrets.WPT_REPORT_API_KEY }}
      WPT_SSH_PRIVATE_KEY_BASE64: ${{ secrets.WPT_SSH_PRIVATE_KEY_BASE64 }}
      PANTHEON_SITE_NAME: ${{ secrets.PANTHEON_SITE_NAME }}
      TERMINUS_MACHINE_TOKEN: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
      WPT_TEST_GROUP: ${{ inputs.test_group }}
      WPT_TEST_FILTER: ${{ inputs.test_filter }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set matrix-derived environment variables
        run: |
          PHP_SHORT=$(echo "${{ matrix.php }}" | tr -d '.')
          DB_SHORT=$(echo "${{ matrix.db }}" | tr -d '.')
          echo "PANTHEON_SITE_ENV=php${PHP_SHORT}-db${DB_SHORT}" >> "$GITHUB_ENV"
          echo "WPT_PHP_EXECUTABLE=php${{ matrix.php }}" >> "$GITHUB_ENV"
          # Label reported to WordPress.org so each PHP/MariaDB combination is
          # distinguishable in the results (e.g. pantheon-php84-db106).
          echo "WPT_LABEL=pantheon-php${PHP_SHORT}-db${DB_SHORT}" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@409451ede17f75acac08f42edc823fee6c435057 # v1
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}

      - name: Install Terminus plugins
        run: |
          terminus self:plugin:install pantheon-systems/terminus-composer-plugin

      # prepare.php also installs this key, but the Verify step below runs first and
      # needs 'terminus remote:wp' (SSH) to reach the container — so set it up here.
      - name: Set up SSH key for Terminus remote commands
        run: |
          mkdir -p ~/.ssh
          echo "$WPT_SSH_PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          {
            echo "Host *.drush.in"
            echo "  HostKeyAlgorithms +ssh-rsa"
            echo "  PubkeyAcceptedKeyTypes +ssh-rsa"
            echo "StrictHostKeyChecking no"
          } >> ~/.ssh/config

      - name: Wake and configure Pantheon environment
        run: |
          terminus art wordpress
          terminus env:wake ${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }}
          terminus site:info ${{ secrets.PANTHEON_SITE_NAME }}
          terminus env:info ${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }}
          terminus connection:set ${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }} sftp

      # Fail fast if the multidev isn't actually running the PHP/MariaDB versions
      # this matrix combination expects. Queries the container's live PHP_VERSION
      # and MariaDB SELECT VERSION() so a drifted pantheon.yml can't silently run
      # (and report) the wrong environment to WordPress.org.
      - name: Verify environment versions
        run: |
          SITE="${{ secrets.PANTHEON_SITE_NAME }}.${{ env.PANTHEON_SITE_ENV }}"
          EXPECT_PHP="${{ matrix.php }}"
          EXPECT_DB="${{ matrix.db }}"
          # PHP snippet run on the container by terminus; $m/$v are PHP vars, so
          # single quotes (no shell expansion) are deliberate.
          # shellcheck disable=SC2016
          INFO='$m=@new mysqli(getenv("DB_HOST"),getenv("DB_USER"),getenv("DB_PASSWORD"),getenv("DB_NAME"),(int)getenv("DB_PORT")); $v=($m && !$m->connect_errno)?$m->query("SELECT VERSION()")->fetch_row()[0]:"unknown"; echo json_encode(["php"=>PHP_VERSION,"db"=>$v]);'
          JSON=$(terminus remote:wp "$SITE" -- eval "$INFO" --skip-wordpress --quiet 2>/dev/null)
          echo "Environment reports: $JSON"
          ACTUAL_PHP=$(echo "$JSON" | jq -r .php)
          ACTUAL_DB=$(echo "$JSON" | jq -r .db)
          ACTUAL_PHP_MM=$(echo "$ACTUAL_PHP" | grep -oE '^[0-9]+\.[0-9]+')
          ACTUAL_DB_MM=$(echo "$ACTUAL_DB" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "PHP     — expected ${EXPECT_PHP}, actual ${ACTUAL_PHP}"
          echo "MariaDB — expected ${EXPECT_DB}, actual ${ACTUAL_DB}"
          STATUS="✅ match"
          if [ "$ACTUAL_PHP_MM" != "$EXPECT_PHP" ]; then
            echo "::error::PHP mismatch on ${PANTHEON_SITE_ENV}: reports ${ACTUAL_PHP}, matrix expects ${EXPECT_PHP}"
            STATUS="❌ mismatch"
          fi
          if [ "$ACTUAL_DB_MM" != "$EXPECT_DB" ]; then
            echo "::error::MariaDB mismatch on ${PANTHEON_SITE_ENV}: reports ${ACTUAL_DB}, matrix expects ${EXPECT_DB}"
            STATUS="❌ mismatch"
          fi
          {
            echo "### Environment verification — ${PANTHEON_SITE_ENV} (${STATUS})"
            echo ""
            echo "| | Expected | Actual |"
            echo "|---|---|---|"
            echo "| PHP | ${EXPECT_PHP} | ${ACTUAL_PHP} |"
            echo "| MariaDB | ${EXPECT_DB} | ${ACTUAL_DB} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "✅ match" ]

      - name: Prepare environment
        run: php prepare.php

      - name: Run unit tests
        run: php test.php
        # Prevent the workflow from stopping if there are test failures.
        continue-on-error: true

      - name: Report the results
        run: php report.php
        # Prevent the workflow from stopping if the reporting fails.
        continue-on-error: true

      - name: Cleanup
        run: php cleanup.php
